name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        folder: [backend, frontend]
    name: verify (${{ matrix.folder }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v5
      # pnpm first: setup-node reads packageManager and needs pnpm on PATH to cache its store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.folder }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The sample CSVs are not in git, so the sample-data suite skips here; every other test runs.
      - run: pnpm verify

  reference:
    name: reference script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s scripts
